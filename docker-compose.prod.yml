services:
  mongo:
    image: mongo:7
    # Mongo's default cache sizing targets 50% of (host RAM - 1GB), which
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    # No host port published — only the backend (on the same Docker network)
    # ever talks to Mongo. Keeps 27017 off the public internet entirely.

  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-catkin}
    depends_on:
      - mongo
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catkin-api.rule=Host(`api.catkinpk.online`)"
      - "traefik.http.routers.catkin-api.entrypoints=websecure"
      - "traefik.http.routers.catkin-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.catkin-api.loadbalancer.server.port=5000"

  frontend:
    build:
      context: ./webFrontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catkin-app.rule=Host(`catkinpk.online`)"
      - "traefik.http.routers.catkin-app.entrypoints=websecure"
      - "traefik.http.routers.catkin-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.catkin-app.loadbalancer.server.port=80"

volumes:
  mongo_data:
